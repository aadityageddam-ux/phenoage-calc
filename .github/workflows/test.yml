name: Verify library
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m build
      - run: |
          python -m venv /tmp/phenoage-wheel
          /tmp/phenoage-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/phenoage-wheel/bin/python "$GITHUB_WORKSPACE/examples/single_and_batch.py"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
